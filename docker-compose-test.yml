# Docker Compose for running the API pytest suite in a contained environment.
#
# Prerequisite:
#   ./setup.sh    # creates apps/api/.env (and the other env files) from .env.example
#
# Usage:
#   # Run the full suite (defaults to `pytest`):
#   docker compose -f docker-compose-test.yml run --rm --build api-tests pytest
#
#   # Run a subset by overriding the command:
#   docker compose -f docker-compose-test.yml run --rm --build api-tests pytest -m unit
#   docker compose -f docker-compose-test.yml run --rm api-tests pytest plane/tests/unit -k "test_workspace"
#
#   # Tear down (removes ephemeral volumes and the test network):
#   docker compose -f docker-compose-test.yml down -v
#
# Notes:
# - Postgres / Valkey / RabbitMQ / MinIO start with health checks; the test
#   runner only starts once each dependency is healthy.
# - Data dirs are tmpfs so every run begins from a clean state.
# - Env vars come from apps/api/.env (the same file the local stack uses); tests
#   use plane.settings.test, which inherits from common and reads DATABASE_URL,
#   REDIS_URL, RABBITMQ_* etc. from the environment.

# Pinned rather than derived from the directory name, which is what both this
# file and its sibling used to get. Sharing a project name means sharing a pod
# and a network, so the two stacks tore down each other's containers: a suite
# left running made the other fail while it was starting, and the errors named
# neither file. A worktree made it worse by giving every checkout the same
# derived name.
#
# Only the ephemeral stacks are pinned. docker-compose.yml, its local sibling
# and the community deployment carry pgdata and uploads, and renaming a project
# orphans its volumes -- the stack returns empty and the data sits under the old
# name -- so those keep the name they have.
name: hangar-test

services:
  test-db:
    image: docker.io/library/postgres:15.7-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-redis:
    image: docker.io/valkey/valkey:7.2.11-alpine
    networks:
      - test_env
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mq:
    image: docker.io/library/rabbitmq:3.13.6-management-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    tmpfs:
      - /var/lib/rabbitmq
    # Rootless Podman can pre-create the image cookie as root. Generate the
    # disposable cookie with its final ownership before dropping privileges.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        head -c 48 /dev/urandom | base64 > /var/lib/rabbitmq/.erlang.cookie
        chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie
        chmod 0600 /var/lib/rabbitmq/.erlang.cookie
        exec su-exec rabbitmq rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  test-minio:
    # S3-compatible object storage. MinIO's community images are no longer
    # published, so this runs SeaweedFS behind the same host name and port.
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    networks:
      - test_env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    entrypoint:
      - /bin/sh
      - -c
      - |
        for key in WEED_JWT_SIGNING_KEY WEED_JWT_SIGNING_READ_KEY WEED_JWT_FILER_SIGNING_KEY WEED_JWT_FILER_SIGNING_READ_KEY; do
          export "$$key=$$(head -c 32 /dev/urandom | base64 | tr -d '=+/\n')"
        done
        exec weed -logtostderr=true mini -dir=/data -ip=test-minio -ip.bind=0.0.0.0 -s3.port=9000 \
          -bucket=${AWS_S3_BUCKET_NAME:-uploads},${IMPORT_S3_BUCKET_NAME:-uploads-imports} \
          -master.telemetry=false -admin.ui=false -webdav=false
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-tests:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # Override service hostnames to point at the test-only services above.
      POSTGRES_HOST: test-db
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}
      REDIS_HOST: test-redis
      REDIS_URL: redis://test-redis:6379/
      RABBITMQ_HOST: test-mq
      AWS_S3_ENDPOINT_URL: http://test-minio:9000
      # Magic-link tests mock the celery delay but the view first checks that
      # EMAIL_HOST is configured. Set a placeholder so the check passes.
      EMAIL_HOST: test-smtp.invalid
      # The auth endpoints throttle anonymous requests per client IP
      # (default 10/minute). The whole suite runs from a single IP, so the
      # magic sign-in/up contract tests would trip the limit mid-run.
      AUTHENTICATION_RATE_LIMIT: 10000/minute
      # Contract tests share an API-key fixture. Keep its aggregate requests
      # from tripping the production API-key throttle during the full suite.
      API_KEY_RATE_LIMIT: 10000/minute
    volumes:
      - ./apps/api:/code
    working_dir: /code
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-mq:
        condition: service_healthy
      test-minio:
        condition: service_healthy
    # Install test-only requirements (not in local.txt) then exec pytest.
    # Any args passed via `docker compose run api-tests <args>` replace the default command.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        pip install --no-cache-dir -r requirements/test.txt
        # STATIC_ROOT must exist or Django's static middleware emits a
        # UserWarning on every request (~100 of the warnings in test runs).
        mkdir -p plane/static-assets/collected-static
        exec "$@"
      - --
    command: ["pytest"]

networks:
  test_env:
    driver: bridge
