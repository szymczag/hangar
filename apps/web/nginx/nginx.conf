worker_processes 4;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  default_type  application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;
    absolute_redirect off;
    port_in_redirect off;

    # Security headers, including the Content-Security-Policy generated from
    # this build by @plane/csp and rendered at start-up (see
    # /docker-entrypoint.d/15-hangar-csp.envsh). A block with its own add_header
    # does not inherit these, so every such block includes the file again.
    include /tmp/nginx-conf.d/security-headers.conf;

    location = /config.js {
      root /usr/share/nginx/html;
      include /tmp/nginx-conf.d/security-headers.conf;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}
