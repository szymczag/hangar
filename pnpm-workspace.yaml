overrides:
  mdast-util-to-hast: 13.2.1
  valibot: 1.4.2
  js-yaml: 4.3.2
  # GHSA-3g3m-2fjr-6pw4 is fixed only in 14.0.2. The one consumer is Storybook's
  # react-docgen plugin (^13.0.1); 14 keeps the same API.
  glob: 14.0.3
  brace-expansion: 5.0.12
  nanoid: 3.3.18
  esbuild: 0.28.1
  "@babel/core": 7.29.7
  "@babel/helpers": 7.29.7
  "@babel/runtime": 7.29.7
  chokidar: 3.6.0
  # Paste-handling XSS (GHSA-c8x8-7fp4-3x9w), fixed 1.42.3. @tiptap/pm 2.27.3
  # itself asks for ^1.42.3; this matches upstream's pin.
  prosemirror-view: 1.42.6
  # prosemirror-view 1.42 needs prosemirror-model ^1.25.12 while the rest of the
  # tree resolved 1.25.11. Two copies in one bundle make every Fragment check
  # fail ("multiple versions of prosemirror-model"), which broke pasting.
  prosemirror-model: 1.25.12
  "@types/express": 4.17.23
  typescript: "catalog:"
  vite: "catalog:"
  qs: 6.16.2
  diff: 5.2.2
  webpack: 5.104.1
  lodash-es: "catalog:"
  lodash: 4.18.1
  markdown-it: 14.3.3
  linkify-it: 5.0.2
  rollup: 4.59.0
  "minimatch@3": 3.1.4
  "minimatch@10": 10.2.3
  serialize-javascript: 7.0.5
  "ajv@6": 6.14.0
  "ajv@8": 8.18.0
  "undici@7": 7.30.1
  flatted: 3.4.2
  picomatch: 2.3.2
  "yaml@1": 1.10.3
  "yaml@2": 2.8.3
  "path-to-regexp@<1": 0.1.13
  defu: 6.1.5
  postcss: 8.5.25
  # GHSA-rj75-hqrm-r3gf (quadratic selector parsing). @tailwindcss/typography
  # pins 6.0.10 exactly, so the floor has to be forced for the whole major.
  "postcss-selector-parser@6": 6.1.5
  "postcss-selector-parser@7": 7.1.7
  axios: "catalog:"
  follow-redirects: 1.16.2
  uuid: "catalog:"
  # EXACT pin: bump the number, never widen -- 4.x breaks ajv's ^3.0.1 (the only
  # consumer here). Floor is 3.1.8, not 3.1.7: it also fixes GHSA-hrr3-gc8f-f4qj,
  # which is MEDIUM so the HIGH/CRITICAL scan won't catch a slip back.
  fast-uri: 3.1.9
  body-parser: 1.20.9
  tmp: 0.2.7
  form-data: 4.0.6
  "ws@8": 8.21.0
  "ws@7": 7.5.11
  "@opentelemetry/core": 2.8.0
  "@opentelemetry/resources": 2.8.0
  "@opentelemetry/sdk-trace-base": 2.8.0
  morgan: 1.12.1
  # express 4 and 5 both pin proxy-addr ~2.0.7 (GHSA-jqcg-44mw-7w3h).
  proxy-addr: 2.0.8
  # serve and @react-router/serve pin compression 1.8.1 (GHSA-vc2v-76pw-4v95).
  compression: "catalog:"
  source-map-js: "catalog:"
  # vitest pins its mocker exactly; keep it on the fixed release with vitest.
  "@vitest/mocker": 4.1.12
  # oxfmt pins tinypool 2.1.0 exactly (GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr).
  tinypool: 2.2.0
  # Prototype pollution and unbounded query-cache growth, both reachable as DoS
  # (CVE-2026-73088 / CVE-2026-73089). browserslist is build tooling only
  # (babel/postcss/vite), but the runtime images copy node_modules wholesale, so
  # it lands in the scanned surface.
  browserslist: ">=4.28.7"
  # CVE-2026-63376 (prototype-pollution -> arbitrary code execution in the TOML
  # parser, fixed 4.1.2), CVE-2026-77465 (DoS via uncontrolled recursion,
  # fixed 4.2.0) and GHSA-4qx8-w7c3-pj3p / GHSA-9j65-hcg3-gc64 (fixed only in
  # 5.0.1). The sole consumer is react-doctor's effect beta (dev tooling), whose
  # ^4.1.1 range has no fixed release; 5.x keeps the same CommonJS parse() API.
  toml: ">=5.0.1 <6"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  turbo: true
  sharp: false

minimumReleaseAgeExclude:
  - "@blueprintjs/core@6.18.0"

patchedDependencies:
  is-emoji-supported@0.0.5: patches/is-emoji-supported@0.0.5.patch
