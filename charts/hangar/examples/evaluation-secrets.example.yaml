# Example structure only. Replace every CHANGE_ME value, store the result in a
# secret-management system, and do not commit the populated manifest.
apiVersion: v1
kind: Secret
metadata:
  name: hangar-application
type: Opaque
stringData:
  SECRET_KEY: CHANGE_ME_RANDOM_64_CHARACTERS
  # Generate with Fernet.generate_key(); this is independent of SECRET_KEY.
  CALENDAR_TOKEN_ENCRYPTION_KEYS: CHANGE_ME_FERNET_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: hangar-live
type: Opaque
stringData:
  LIVE_SERVER_SECRET_KEY: CHANGE_ME_RANDOM_64_CHARACTERS
---
apiVersion: v1
kind: Secret
metadata:
  name: hangar-database
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_ADMIN_PASSWORD
  POSTGRES_DB: hangar
  USERDB_USER: hangar
  USERDB_PASSWORD: CHANGE_ME_HANGAR_DATABASE_PASSWORD
  DATABASE_URL: postgresql://hangar:CHANGE_ME_HANGAR_DATABASE_PASSWORD@hangar-evaluation-postgresql:5432/hangar
---
apiVersion: v1
kind: Secret
metadata:
  name: hangar-cache
type: Opaque
stringData:
  REDIS_URL: redis://hangar:CHANGE_ME_VALKEY_PASSWORD@hangar-evaluation-valkey:6379/0
  VALKEY_PASSWORD: CHANGE_ME_VALKEY_PASSWORD
  users.acl: "user default off\nuser hangar on >CHANGE_ME_VALKEY_PASSWORD ~* &* +@all"
---
apiVersion: v1
kind: Secret
metadata:
  name: hangar-queue
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: hangar
  RABBITMQ_DEFAULT_PASS: CHANGE_ME_RABBITMQ_PASSWORD
  ERLANG_COOKIE: CHANGE_ME_RANDOM_64_CHARACTERS
  AMQP_URL: amqp://hangar:CHANGE_ME_RABBITMQ_PASSWORD@hangar-evaluation-rabbitmq:5672/%2F
---
apiVersion: v1
kind: Secret
metadata:
  name: hangar-object-storage
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME_S3_ACCESS_KEY
  AWS_SECRET_ACCESS_KEY: CHANGE_ME_S3_SECRET_KEY
