deploymentProfile: production

publicUrl:
  scheme: https
  host: hangar.example.com

ingress:
  enabled: false

gateway:
  enabled: true
  create: true
  className: envoy
  name: public-mtls
  namespace: ""
  sectionName: https
  annotations: {}
  tls:
    secretName: hangar-tls

# The Envoy Gateway preset selects data-plane Pods in envoy-gateway-system
# owned by gateway.name. Use the custom preset for another namespace or label
# contract.
networkPolicy:
  ingressController:
    preset: envoyGateway
