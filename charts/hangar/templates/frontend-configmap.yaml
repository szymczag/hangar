apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hangar.fullname" . }}-frontend
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
data:
  config.js: |
    globalThis.__HANGAR_CONFIG__ = Object.freeze({
      VITE_ADMIN_BASE_URL: {{ include "hangar.publicOrigin" . | quote }},
      VITE_SPACE_BASE_URL: {{ include "hangar.publicOrigin" . | quote }},
      VITE_LIVE_BASE_URL: {{ include "hangar.publicOrigin" . | quote }},
      VITE_WEB_BASE_URL: {{ include "hangar.publicOrigin" . | quote }},
      VITE_API_BASE_URL: {{ include "hangar.publicOrigin" . | quote }}
    });
