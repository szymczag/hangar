{{- if ge (int .Values.migrator.databaseWaitSeconds) (int .Values.migrator.activeDeadlineSeconds) }}
{{- fail "migrator.databaseWaitSeconds must be less than migrator.activeDeadlineSeconds" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-%d" (include "hangar.fullname" .) .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
spec:
  activeDeadlineSeconds: {{ .Values.migrator.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migrator.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrator.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "hangar.selectorLabels" (dict "component" "migrator" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "hangar.podSecurityContext" (dict "uid" 10001 "gid" 10001) | nindent 8 }}
      {{- with concat .Values.global.imagePullSecrets .Values.api.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrator
          image: {{ include "hangar.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              python - <<'PY'
              import os
              import socket
              import time
              from urllib.parse import urlparse

              database = urlparse(os.environ["DATABASE_URL"])
              if not database.hostname:
                  raise SystemExit("DATABASE_URL does not contain a hostname")

              deadline = time.monotonic() + {{ .Values.migrator.databaseWaitSeconds }}
              while True:
                  try:
                      with socket.create_connection(
                          (database.hostname, database.port or 5432), timeout=3
                      ):
                          break
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise SystemExit("database did not become reachable before timeout")
                      time.sleep(2)
              PY
              exec ./bin/docker-entrypoint-migrator.sh
          securityContext:
            {{- include "hangar.containerSecurityContext" (dict "uid" 10001 "gid" 10001) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "hangar.fullname" . }}-api
          env:
            {{- include "hangar.coreSecretEnv" . | nindent 12 }}
            {{- include "hangar.cacheSecretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /code/plane/logs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
      {{- include "hangar.scheduling" . | nindent 6 }}
