{{- if .Values.evaluation.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hangar.fullname" . }}-evaluation-object-storage
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluation-object-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: evaluationObjectStorage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hangar.fullname" . }}-evaluation-object-storage
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluation-object-storage
spec:
  serviceName: {{ include "hangar.fullname" . }}-evaluation-object-storage
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluationObjectStorage
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluationObjectStorage
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: evaluation-object-storage
        app.kubernetes.io/part-of: hangar
    spec:
      serviceAccountName: {{ .Values.evaluationObjectStorage.serviceAccountName }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "hangar.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.evaluationObjectStorage.nodeSelector | nindent 8 }}
      containers:
        - name: seaweedfs
          image: {{ printf "%s:%s" .Values.evaluationObjectStorage.image.repository .Values.evaluationObjectStorage.image.tag | quote }}
          imagePullPolicy: {{ .Values.evaluationObjectStorage.image.pullPolicy }}
          args:
            - mini
            - -dir=/data
            - -ip.bind=0.0.0.0
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.objectStorage.name }}
                  key: {{ .Values.existingSecrets.objectStorage.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.objectStorage.name }}
                  key: {{ .Values.existingSecrets.objectStorage.secretAccessKeyKey }}
            - name: S3_BUCKET
              value: {{ .Values.externalServices.objectStorage.bucket | quote }}
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
          securityContext:
            {{- include "hangar.containerSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.evaluationObjectStorage.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.evaluationObjectStorage.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.evaluationObjectStorage.persistence.size }}
{{- end }}
