{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "hangar.gatewayName" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: {{ .Values.gateway.sectionName }}
      hostname: {{ .Values.publicUrl.host | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hangar.fullname" . }}-trailing-slash
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "hangar.gatewayParentRef" . | nindent 4 }}
  hostnames:
    - {{ .Values.publicUrl.host | quote }}
  rules:
    {{- range $path := list "/god-mode" "/spaces" "/live" "/api" }}
    - matches:
        - path:
            type: Exact
            value: {{ $path }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ printf "%s/" $path }}
            statusCode: 308
    {{- end }}
---
{{- range $route := list (dict "name" "admin" "path" "/god-mode/" "service" "admin") (dict "name" "spaces" "path" "/spaces/" "service" "space") (dict "name" "live" "path" "/live/" "service" "live") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hangar.fullname" $ }}-{{ $route.name }}
  labels:
    {{- include "hangar.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- include "hangar.gatewayParentRef" $ | nindent 4 }}
  hostnames:
    - {{ $.Values.publicUrl.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.path }}
      backendRefs:
        - name: {{ include "hangar.fullname" $ }}-{{ $route.service }}
          port: 3000
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hangar.fullname" . }}-api
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "hangar.gatewayParentRef" . | nindent 4 }}
  hostnames:
    - {{ .Values.publicUrl.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /static
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Host
                value: {{ .Values.publicUrl.host | quote }}
              - name: X-Forwarded-Port
                value: "443"
      backendRefs:
        - name: {{ include "hangar.fullname" . }}-api
          port: 8000
---
{{- if .Values.evaluation.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hangar.fullname" . }}-object-storage
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "hangar.gatewayParentRef" . | nindent 4 }}
  hostnames:
    - {{ .Values.publicUrl.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "/%s" .Values.externalServices.objectStorage.bucket | quote }}
      backendRefs:
        - name: {{ include "hangar.fullname" . }}-evaluation-object-storage
          port: 8333
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hangar.fullname" . }}-web
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "hangar.gatewayParentRef" . | nindent 4 }}
  hostnames:
    - {{ .Values.publicUrl.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "hangar.fullname" . }}-web
          port: 3000
{{- end }}
