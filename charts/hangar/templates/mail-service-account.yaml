{{- if and .Values.mail.enabled .Values.mail.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-mail" (include "hangar.fullname" .)) .Values.mail.serviceAccount.name }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  {{- with .Values.mail.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
