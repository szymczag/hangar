{{- $objectStorageEndpoint := .Values.externalServices.objectStorage.endpoint -}}
{{- $objectStoragePublicEndpoint := default $objectStorageEndpoint .Values.externalServices.objectStorage.publicEndpoint -}}
{{- $objectStoragePathStyle := .Values.externalServices.objectStorage.pathStyle -}}
{{- if .Values.evaluation.enabled -}}
{{- $objectStorageEndpoint = printf "http://%s-evaluation-object-storage:8333" (include "hangar.fullname" .) -}}
{{- $objectStoragePublicEndpoint = include "hangar.publicOrigin" . -}}
{{- $objectStoragePathStyle = true -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hangar.fullname" . }}-api
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
data:
  DEBUG: "0"
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  ALLOWED_HOSTS: {{ join "," (concat (list .Values.publicUrl.host) .Values.application.allowedHosts) | quote }}
  CORS_ALLOWED_ORIGINS: {{ include "hangar.publicOrigin" . | quote }}
  WEB_URL: {{ include "hangar.publicOrigin" . | quote }}
  APP_BASE_URL: {{ include "hangar.publicOrigin" . | quote }}
  APP_BASE_PATH: "/"
  ADMIN_BASE_URL: {{ include "hangar.publicOrigin" . | quote }}
  ADMIN_BASE_PATH: "/god-mode"
  SPACE_BASE_URL: {{ include "hangar.publicOrigin" . | quote }}
  SPACE_BASE_PATH: "/spaces"
  LIVE_BASE_URL: {{ include "hangar.publicOrigin" . | quote }}
  LIVE_BASE_PATH: "/live"
  AWS_S3_ENDPOINT_URL: {{ $objectStorageEndpoint | quote }}
  AWS_S3_PUBLIC_ENDPOINT_URL: {{ $objectStoragePublicEndpoint | quote }}
  AWS_S3_BUCKET_NAME: {{ .Values.externalServices.objectStorage.bucket | quote }}
  IMPORT_S3_BUCKET_NAME: {{ .Values.externalServices.objectStorage.importBucket | quote }}
  TODOIST_IMPORTS_ENABLED: {{ ternary "1" "0" .Values.todoistImports.enabled | quote }}
  ENABLE_GOOGLE_CALENDAR_CAPACITY: {{ ternary "1" "0" .Values.googleCalendarCapacity.enabled | quote }}
  TODOIST_IMPORT_LEASE_SECONDS: {{ printf "%d" (int64 .Values.todoistImports.leaseSeconds) | quote }}
  TODOIST_IMPORT_RECOVERY_GRACE_SECONDS: {{ printf "%d" (int64 .Values.todoistImports.recoveryGraceSeconds) | quote }}
  TODOIST_IMPORT_SOURCE_RETENTION_HOURS: {{ printf "%d" (int64 .Values.todoistImports.sourceRetentionHours) | quote }}
  TODOIST_IMPORT_PREVIEW_USER_RATE: {{ .Values.todoistImports.previewUserRate | quote }}
  TODOIST_IMPORT_PREVIEW_WORKSPACE_RATE: {{ .Values.todoistImports.previewWorkspaceRate | quote }}
  TODOIST_IMPORT_EXECUTE_USER_RATE: {{ .Values.todoistImports.executeUserRate | quote }}
  TODOIST_IMPORT_EXECUTE_WORKSPACE_RATE: {{ .Values.todoistImports.executeWorkspaceRate | quote }}
  TODOIST_IMPORT_MAX_ACTIVE_PER_USER: {{ printf "%d" (int64 .Values.todoistImports.maxActivePerUser) | quote }}
  TODOIST_IMPORT_MAX_ACTIVE_PER_WORKSPACE: {{ printf "%d" (int64 .Values.todoistImports.maxActivePerWorkspace) | quote }}
  TODOIST_IMPORT_MAX_ROWS_PER_WORKSPACE_24H: {{ printf "%d" (int64 .Values.todoistImports.maxRowsPerWorkspace24h) | quote }}
  TODOIST_IMPORT_MAX_ACTIVE_SOURCE_BYTES_PER_WORKSPACE: {{ printf "%d" (int64 .Values.todoistImports.maxActiveSourceBytesPerWorkspace) | quote }}
  TODOIST_IMPORT_WORKER_CONCURRENCY: {{ printf "%d" (int64 .Values.todoistImports.worker.concurrency) | quote }}
  TODOIST_IMPORT_WORKER_PREFETCH_MULTIPLIER: {{ printf "%d" (int64 .Values.todoistImports.worker.prefetchMultiplier) | quote }}
  AWS_REGION: {{ .Values.externalServices.objectStorage.region | quote }}
  USE_MINIO: {{ ternary "1" "0" $objectStoragePathStyle | quote }}
  MINIO_ENDPOINT_SSL: {{ ternary "1" "0" (hasPrefix "https://" $objectStorageEndpoint) | quote }}
  FILE_SIZE_LIMIT: {{ printf "%d" (int64 .Values.application.fileSizeLimit) | quote }}
  SIGNED_URL_EXPIRATION: {{ printf "%d" (int64 .Values.application.signedUrlExpiration) | quote }}
  HARD_DELETE_AFTER_DAYS: {{ printf "%d" (int64 .Values.application.hardDeleteAfterDays) | quote }}
  API_KEY_RATE_LIMIT: {{ .Values.application.apiKeyRateLimit | quote }}
  WEBHOOK_ALLOWED_HOSTS: {{ join "," .Values.application.webhookAllowedHosts | quote }}
  WEBHOOK_ALLOWED_IPS: {{ join "," .Values.application.webhookAllowedCIDRs | quote }}
  WEBHOOK_DISALLOWED_DOMAINS: {{ join "," .Values.application.webhookDisallowedDomains | quote }}
  HANGAR_DOCUMENTATION_URL: {{ .Values.branding.documentationUrl | quote }}
  HANGAR_ISSUES_URL: {{ .Values.branding.issuesUrl | quote }}
  HANGAR_SECURITY_URL: {{ .Values.branding.securityUrl | quote }}
  HANGAR_TERMS_URL: {{ .Values.branding.termsUrl | quote }}
  HANGAR_PRIVACY_URL: {{ .Values.branding.privacyUrl | quote }}
  INSTANCE_CHANGELOG_URL: ""
  RELEASE_DISCOVERY_URL: ""
  OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | quote }}
  OTLP_METRICS_PROTOCOL: {{ .Values.observability.metricsProtocol | quote }}
  DEPENDENCY_WAIT_TIMEOUT_SECONDS: "300"
  MIGRATION_WAIT_TIMEOUT_SECONDS: "600"
  {{- if .Values.mail.enabled }}
  EMAIL_PROVIDER: {{ .Values.mail.provider | quote }}
  ENABLE_SMTP: "1"
  EMAIL_FROM: {{ .Values.mail.sender | quote }}
  EMAIL_REPLY_TO: {{ .Values.mail.replyTo | quote }}
  EMAIL_MESSAGE_ID_DOMAIN: {{ .Values.mail.messageIdDomain | quote }}
  EMAIL_SES_REGION: {{ .Values.mail.ses.region | quote }}
  EMAIL_SES_ACCOUNT_ID: {{ .Values.mail.ses.accountId | quote }}
  EMAIL_SES_CONFIGURATION_SET_AUTH: {{ .Values.mail.ses.authConfigurationSet | quote }}
  EMAIL_SES_CONFIGURATION_SET_NOTIFICATIONS: {{ .Values.mail.ses.notificationConfigurationSet | quote }}
  EMAIL_SES_EVENTS_QUEUE_URL: {{ .Values.mail.ses.eventsQueueUrl | quote }}
  EMAIL_SES_EVENTS_TOPIC_ARN: {{ .Values.mail.ses.eventsTopicArn | quote }}
  EMAIL_DELIVERY_V2_ENABLED: "1"
  EMAIL_OPENPGP_ENABLED: {{ ternary "1" "0" .Values.mail.openpgp.enabled | quote }}
  EMAIL_AUDIT_RETENTION_DAYS: {{ .Values.mail.auditRetentionDays | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hangar.fullname" . }}-live
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
data:
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  PORT: "3000"
  API_BASE_URL: {{ printf "http://%s-api:8000" (include "hangar.fullname" .) | quote }}
  WEB_BASE_URL: {{ include "hangar.publicOrigin" . | quote }}
  LIVE_BASE_URL: {{ include "hangar.publicOrigin" . | quote }}
  LIVE_BASE_PATH: "/live"
  CORS_ALLOWED_ORIGINS: {{ include "hangar.publicOrigin" . | quote }}
  PDF_ASSET_ALLOWED_HOSTS: {{ join "," .Values.live.pdfAssetAllowedHosts | quote }}
