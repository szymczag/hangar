{{- $root := . -}}
{{- range $component := list (dict "name" "web" "port" 3000) (dict "name" "admin" "port" 3000) (dict "name" "space" "port" 3000) (dict "name" "live" "port" 3000) (dict "name" "api" "port" 8000) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hangar.fullname" $root }}-{{ $component.name }}
  labels:
    {{- include "hangar.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "hangar.selectorLabels" (dict "component" $component.name "Values" $root.Values "Chart" $root.Chart "Release" $root.Release) | nindent 4 }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
