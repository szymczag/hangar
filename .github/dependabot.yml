# Dependabot configuration.
#
# npm and uv (the API's Python packages) receive security updates only. The
# application tree follows the upstream project, and routine version bumps there
# would collide with upstream syncs; open-pull-requests-limit: 0 turns version
# updates off without affecting security updates, which the groups below batch
# into one pull request per ecosystem.
#
# Container base images, the third-party images in the Compose deployment and
# GitHub Actions receive weekly version updates.
# Dependabot finds every file whose name contains "dockerfile" (Dockerfile.web,
# Dockerfile.ce, Dockerfile.dev, ...). A bump of a base image that a test pins
# (.github/scripts/tests/test_container_runtime_hardening.py,
# test_proxy_base_images.py) needs that test updated in the same pull request.
#
# Dependabot does not see OS packages inside the published images. Those are
# covered by the nightly image scan in .github/workflows/security-scan.yml, and
# every release build refreshes them (APK_SECURITY_PATCH in build-branch.yml).

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Version updates are off, so this changes nothing today; it keeps a
    # re-enabled version update from proposing a release in its first week.
    # Security updates are not delayed by a cooldown.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # apps/api is managed by uv: pyproject.toml declares the dependencies and
  # uv.lock pins every package with its hashes.
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Version updates are off, so this changes nothing today; it keeps a
    # re-enabled version update from proposing a release in its first week.
    # Security updates are not delayed by a cooldown.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/admin
      - /apps/space
      - /apps/live
      - /apps/api
      - /apps/proxy
      - /deployments/aio/community
    target-branch: preview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node majors and Python minors change the runtime; move them on purpose.
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*python"
        versions: [">=3.13"]
      # The uv build image must match [tool.uv] required-version in
      # apps/api/pyproject.toml, which Dependabot does not edit; a lone image
      # bump fails the build. Move both together by hand.
      - dependency-name: "*astral-sh/uv"

  # The Postgres, Valkey, RabbitMQ and SeaweedFS images the Compose deployment
  # pins by tag and digest. A major version of a data service is a data
  # migration, not a bump: Postgres needs pg_upgrade and RabbitMQ 4 needs its
  # feature flags enabled first, so those stay manual.
  - package-ecosystem: docker-compose
    directory: /deployments/cli/community
    target-branch: preview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*rabbitmq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*valkey"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: preview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
