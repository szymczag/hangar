name: Bug report
description: Report a reproducible problem in Hangar
title: "[bug]: "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a Hangar bug.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Current behavior
      description: A concise description of what you're experiencing and what you expect
      placeholder: |
        When I do <X>, <Y> happens and I see the error message attached below:
        ```...```
        What I expect is <Z>
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Add steps to reproduce this behaviour, include console or network logs and screenshots
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Production
        - Deploy preview
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Mozilla Firefox
        - Safari
        - Other
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      description: How is this Hangar instance deployed?
      options:
        - Docker Compose (setup.sh)
        - Docker Swarm (swarm.sh)
        - All-in-one image
        - Kubernetes (Helm chart)
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which Hangar release are you running? The build identity dialog and the image tag show it.
      placeholder: v0.1.3
    validations:
      required: true
