name: Security scan

# Dependency and image vulnerability gates. CodeQL covers the code itself; this
# covers what the code is built from.
#
# - Pull requests that change a dependency manifest or a Dockerfile must not
#   bring in a fixable HIGH or CRITICAL advisory (pip-audit, pnpm audit, Trivy
#   over the repository).
# - Nightly, and again as soon as a release is published, the images of the
#   latest published GitHub Release are scanned as published. The results land
#   in code scanning next to CodeQL's, and one issue labelled `security-scan`
#   tracks what is open; it closes itself once the latest release scans clean.
#   Dependabot does not see these packages, so this is where they surface.
#
# A failed image job means one of two things, and the log names which: the
# image has fixable HIGH or CRITICAL findings, or the scan could not run.
# Network steps (installing Cosign, verifying the Trivy signature, reading the
# release image, downloading the vulnerability database) are retried, so a
# transient outage of a download host does not read as either.
#
# Every action is pinned to a full commit SHA and Trivy runs from its official
# image pinned to a digest, whose Sigstore signature is verified once per run
# before any job uses it: in March 2026 the trivy-action tags were moved to
# malicious commits (GHSA-69fq-xp46-6x23), and a pinned digest or SHA is not
# affected by that.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  # Scan a release right after it is published. Only tag pushes publish one;
  # a manual run of that workflow refreshes preview images instead.
  workflow_run:
    workflows: ["Publish Hangar Containers"]
    types: [completed]
  push:
    branches: ["preview"]
    paths:
      - "apps/api/requirements/**"
      - "apps/api/requirements.txt"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "**/package.json"
      - "**/Dockerfile*"
      - ".trivyignore"
      - ".github/workflows/security-scan.yml"
      - ".github/scripts/security_scan.py"
  pull_request:
    branches: ["preview"]
    paths:
      - "apps/api/requirements/**"
      - "apps/api/requirements.txt"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "**/package.json"
      - "**/Dockerfile*"
      - ".trivyignore"
      - ".github/workflows/security-scan.yml"
      - ".github/scripts/security_scan.py"

permissions:
  contents: read

concurrency:
  # The event is part of the key so a push to preview cannot cancel the
  # nightly image scan, which runs on the same ref.
  group: security-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/aquasecurity/trivy:0.76.1 (multi-arch index). Bump both together.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  python:
    name: Python dependencies (pip-audit)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.x"
      # psycopg[c] builds from source while pip resolves the tree.
      - name: Install build headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      # The production tree, resolved with its transitive dependencies.
      #
      # GHSA-gvp8-978c-rx2q (PyJWT, no patched release): the advisory needs an
      # options dict shared between jwt.decode() calls; both callers build a
      # fresh one per call (authentication/provider/oauth/google.py,
      # ext/auth/provider/oidc.py).
      - name: Audit production requirements
        working-directory: apps/api
        run: >-
          pip-audit
          --requirement requirements/production.txt
          --progress-spinner off
          --desc on
          --ignore-vuln GHSA-gvp8-978c-rx2q

  node:
    name: Node dependencies (pnpm audit)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      - name: Enable Corepack and pnpm
        run: corepack enable pnpm
      # Reads the lockfile; nothing is installed. Production dependencies only:
      # what ships in the images. Moderate and lower are reported, not gated.
      - name: Audit production dependencies
        run: |
          pnpm audit --prod || true
          pnpm audit --prod --audit-level high

  trivy:
    name: Verify Trivy image
    # Runs for every event except a release workflow that did not publish.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      # The installer downloads Cosign from GitHub Releases, which has failed
      # with 504s; the action does not retry on its own.
      - name: Install Cosign
        id: cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Wait before retrying the Cosign install
        if: steps.cosign.outcome == 'failure'
        run: sleep 30
      - name: Install Cosign (retry)
        if: steps.cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # TRIVY_IMAGE is pinned by digest, so one verification covers every job
      # in this run that pulls it.
      - name: Verify the Trivy image signature
        run: |
          set -euo pipefail
          for delay in 15 45 0; do
            if cosign verify "$TRIVY_IMAGE" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/aquasecurity/trivy/\.github/workflows/.+' \
              > /dev/null; then
              exit 0
            fi
            if [[ "$delay" -gt 0 ]]; then
              echo "::warning::Trivy signature verification failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Could not verify the Trivy image signature"
          exit 1

  repository:
    name: Repository (Trivy)
    if: github.event_name != 'workflow_run'
    needs: trivy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Lockfiles and requirements: dependencies with a fixable HIGH or
      # CRITICAL advisory. The SARIF run never fails, so its results reach code
      # scanning; the second run is the gate.
      - name: Scan the repository
        id: scan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/out" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -w /src "$TRIVY_IMAGE" \
              fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --skip-dirs node_modules "$@" .
          }
          scan --format sarif --output /out/trivy-fs.sarif
          echo "sarif=true" >> "$GITHUB_OUTPUT"
          scan --exit-code 1
      - name: Upload results to code scanning
        if: always() && steps.scan.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-fs.sarif
          category: trivy-repository

  release:
    name: Resolve published release
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # The release workflow creates the GitHub Release only after every image
      # is pushed, signed and verified, so a published Release always has its
      # images. A tag alone does not: publication waits for approval.
      - name: Resolve the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName,isDraft \
            | python3 .github/scripts/security_scan.py resolve >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  images:
    name: Release images (Trivy)
    needs: [trivy, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, admin, space, live, api, proxy]
    env:
      IMAGE_REF: ghcr.io/szymczag/hangar-${{ matrix.image }}:${{ needs.release.outputs.version }}
    steps:
      # .trivyignore and the summary script.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # A published release whose image cannot be read is a real fault, not a
      # race, so after the retries this fails with that message.
      - name: Check the release image exists
        run: |
          set -euo pipefail
          for delay in 15 45 0; do
            if docker buildx imagetools inspect "$IMAGE_REF" > /dev/null; then
              exit 0
            fi
            if [[ "$delay" -gt 0 ]]; then
              echo "::warning::Could not read $IMAGE_REF; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Release ${{ needs.release.outputs.tag }} is published but $IMAGE_REF cannot be read"
          exit 1
      # The release images are public, so no registry credentials are passed:
      # Trivy would offer them to every registry it contacts, including the
      # vulnerability-database mirror. The scan itself never fails on
      # findings; a non-zero exit is a tool or download error and is retried.
      - name: Scan the image
        run: |
          set -euo pipefail
          echo "Scanning $IMAGE_REF"
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for delay in 20 60 0; do
            if docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/out" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -w /src \
              "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed \
              --format json --output /out/trivy-image.json "$IMAGE_REF"; then
              exit 0
            fi
            if [[ "$delay" -gt 0 ]]; then
              echo "::warning::Trivy could not scan $IMAGE_REF; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Trivy could not scan $IMAGE_REF"
          exit 1
      - name: Convert the report
        id: convert
        run: |
          set -euo pipefail
          convert() {
            docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY_IMAGE" convert "$@" /out/trivy-image.json
          }
          convert --format sarif --output /out/trivy-image.sarif
          echo "sarif=true" >> "$GITHUB_OUTPUT"
          convert --format table
      - name: Upload results to code scanning
        if: always() && steps.convert.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-image.sarif
          category: trivy-image-${{ matrix.image }}
      - name: Gate on findings
        run: >-
          python3 .github/scripts/security_scan.py summarize
          --image "${{ matrix.image }}"
          --image-ref "$IMAGE_REF"
          --report "$RUNNER_TEMP/trivy-image.json"
          --output "$RUNNER_TEMP/findings/findings-${{ matrix.image }}.json"
          --fail-on-findings
          --step-summary "$GITHUB_STEP_SUMMARY"
      # Written only when the scan completed; the report job reads a missing
      # file as "not scanned".
      - name: Keep the findings for the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-${{ matrix.image }}
          path: ${{ runner.temp }}/findings/findings-${{ matrix.image }}.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report release image findings
    needs: [release, images]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    concurrency:
      group: security-scan-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Collect the findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: findings-*
          path: ${{ runner.temp }}/findings
          merge-multiple: true
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/scripts/security_scan.py report
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --run-url "$RUN_URL"
          --findings-dir "$RUNNER_TEMP/findings"
          --images web,admin,space,live,api,proxy
          --step-summary "$GITHUB_STEP_SUMMARY"
