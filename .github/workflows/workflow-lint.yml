name: Workflow lint

# Static checks for the GitHub Actions configuration itself.
#
# - actionlint checks workflow syntax, expressions, job wiring and, through the
#   shellcheck bundled in its image, every `run:` script.
# - zizmor audits for workflow security problems: template injection, token
#   persistence, over-broad permissions, dangerous triggers and pins whose
#   version comment no longer matches the commit. Reviewed exceptions live in
#   .github/zizmor.yml, each with its reason.
#
# Both tools are pinned: actionlint by image digest, zizmor by an exact
# version installed from the hash-locked .github/zizmor-requirements.txt.
# Findings fail the job and are printed in the log; nothing is uploaded, so
# neither job needs more than read access.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - preview

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # rhysd/actionlint:1.7.12 (multi-arch index digest).
      - name: Run actionlint
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Installed from PyPI rather than through zizmorcore/zizmor-action, which
      # the repository's allowed-actions policy does not list. The
      # requirements file pins the exact version and every file's hash.
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install \
            --quiet --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes --requirement .github/zizmor-requirements.txt
          echo "$RUNNER_TEMP/zizmor/bin" >> "$GITHUB_PATH"

      # The token only reads public data: online audits check that each pinned
      # commit belongs to its repository and matches its version comment.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .
