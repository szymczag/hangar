name: Build and lint API

# Deliberately unfiltered by path. A path filter here stops the whole workflow
# from running, so a required check inside it would never report on a pull
# request that does not touch the API and would block it forever. The filter now
# lives in the changes job, which the lint job is gated on.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      # Asked of the API rather than computed from a checkout: the answer is one
      # request, and it needs no clone and no reasoning about how deep to fetch.
      - name: Decide whether the API changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A manual run has no pull request to compare against, so it lints
          # everything rather than guessing.
          if [ -z "${PR:-}" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if printf '%s\n' "$changed" | grep -qE '^(apps/api/|\.github/workflows/pull-request-build-lint-api\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # The former condition also required requested_reviewers to be non-null,
    # which a manual run can never satisfy — github.event.pull_request is null
    # there — so workflow_dispatch never did anything. Drafts are still skipped;
    # `!= true` rather than `== false` so a null on a manual run does not skip.
    if: needs.changes.outputs.api == 'true' && github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'
      # The pin is read from the requirements file rather than repeated here, so
      # CI and anyone running ruff locally use the same version and there is one
      # place to change it. Installed on its own rather than through the file,
      # which pulls in the whole dependency tree that a static analyser does not
      # need. Unpinned, a ruff release changes the result overnight.
      - name: Install ruff
        run: python -m pip install "$(grep '^ruff==' apps/api/requirements/local.txt)"
      - name: Install API Dependencies
        run: cd apps/api && pip install -r requirements.txt
      # Without --fix. Ruff fixed what it found and exited zero, so the job was
      # green whatever it found, and the fix died with the runner.
      - name: Lint apps/api
        run: ruff check apps/api
      # Scoped to the fork's own code on purpose. Across apps/api/plane, ruff
      # would reformat 48 files, and 41 of them are inherited from upstream and
      # mostly carry upstream's own style rather than any drift of ours. Rewriting
      # those means a formatting conflict in every future upstream merge, bought
      # with nothing. plane/ext is entirely ours and already formatted, so this
      # starts green and stays that way.
      - name: Check formatting of fork-owned API code
        run: ruff format --check apps/api/plane/ext

  # The context to require on the branch ruleset. It runs whatever the lint job
  # did, so it reports on every pull request, and treats skipped as success so a
  # change that touches no Python is not held up by it.
  api-lint:
    name: API lint
    needs: [changes, lint-api]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the lint job to have succeeded or been skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint-api.result }}
        run: |
          set -euo pipefail

          failed=0
          for entry in "changes=$CHANGES_RESULT" "lint-api=$LINT_RESULT"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              *) echo "$name: $result" >&2; failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "API lint did not complete successfully." >&2
            exit 1
          fi

