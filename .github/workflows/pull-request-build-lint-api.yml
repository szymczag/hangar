name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.requested_reviewers != null
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'
      # The pin is read from the requirements file rather than repeated here, so
      # CI and anyone running ruff locally use the same version and there is one
      # place to change it. Installed on its own rather than through the file,
      # which pulls in the whole dependency tree that a static analyser does not
      # need. Unpinned, a ruff release changes the result overnight.
      - name: Install ruff
        run: python -m pip install "$(grep '^ruff==' apps/api/requirements/local.txt)"
      - name: Install API Dependencies
        run: cd apps/api && pip install -r requirements.txt
      # Without --fix. Ruff fixed what it found and exited zero, so the job was
      # green whatever it found, and the fix died with the runner.
      - name: Lint apps/api
        run: ruff check apps/api
      # Scoped to the fork's own code on purpose. Across apps/api/plane, ruff
      # would reformat 48 files, and 41 of them are inherited from Plane and
      # mostly carry Plane's own style rather than any drift of ours. Rewriting
      # those means a formatting conflict in every future upstream merge, bought
      # with nothing. plane/ext is entirely ours and already formatted, so this
      # starts green and stays that way.
      - name: Check formatting of fork-owned API code
        run: ruff format --check apps/api/plane/ext
