name: Build and lint web apps

on:
  workflow_dispatch:
  push:
    branches:
      - "preview"
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "reopened"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format check has no build dependencies - run immediately in parallel
  check-format:
    name: check:format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.requested_reviewers != null)
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm turbo run check:format
          else
            pnpm turbo run check:format --affected
          fi

  # Build packages - required for lint and type checks
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.requested_reviewers != null)
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ env.TURBO_SCM_BASE }}-${{ env.TURBO_SCM_HEAD }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ env.TURBO_SCM_BASE }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm turbo run build
          else
            pnpm turbo run build --affected
          fi

      # Trusted Types bundle contract (docs/trusted-types-plan.md, phase 3).
      # Every DOM sink Trusted Types guards, in each built frontend, is mapped
      # through hidden source maps to the package or file it came from and
      # compared with the reviewed inventory in packages/csp/bundle-sinks/. A
      # dependency upgrade that brings a new sink fails here instead of in a
      # browser once the policy is enforced. Always all three apps, not
      # --affected: a lockfile change is exactly the case this exists for. The
      # source-map build has its own cache key (HANGAR_BUNDLE_SOURCEMAPS is in
      # turbo's globalEnv) and never reaches an image.
      - name: Check Trusted Types sinks in the bundles
        env:
          HANGAR_BUNDLE_SOURCEMAPS: "1"
        run: |
          # The step above built these without source maps into the same
          # directories. Leaving those chunks in place made the scan see a
          # mixture of mapped and unmapped files, whose sinks it could not
          # attribute, and the check passed or failed depending on which
          # artifacts survived.
          rm -rf apps/web/build apps/admin/build apps/space/build
          pnpm turbo run build --filter=web --filter=admin --filter=space
          for app in web admin space; do
            node packages/csp/bin/bundle-sinks.mjs \
              --assets "apps/$app/build/client/assets" \
              --inventory "packages/csp/bundle-sinks/$app.json"
          done

      # Nothing had ever run either Storybook -- no workflow, no turbo task, no
      # chromatic -- which is why `packages/ui`'s could sit broken indefinitely,
      # importing a stylesheet that no longer existed. Repairing it without
      # building it in CI would buy the same outcome again in six months.
      #
      # Deliberately not `--affected`: a change to the shared tailwind config or
      # to a component's stories is exactly the kind of thing that breaks a
      # Storybook build, and `--affected` is the mechanism by which that would
      # not be noticed.
      - name: Build Storybooks
        run: pnpm turbo run build-storybook

      - name: Save Turbo cache
        uses: actions/cache/save@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ env.TURBO_SCM_BASE }}-${{ env.TURBO_SCM_HEAD }}

  # Lint check - no build dependency, OxLint is a standalone Rust binary
  check-lint:
    name: check:lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.requested_reviewers != null)
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check:lint
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm turbo run check:lint
          else
            pnpm turbo run check:lint --affected
          fi

      - name: Check React runtime contracts
        run: pnpm test:react-runtime-contracts

      # Source-level invariants for the God Mode forms, which have no test
      # runner of their own.
      - name: Check God Mode form contracts
        run: pnpm test:admin-form-contracts

      # Five packages carry vitest suites and nothing ran them, so they passed
      # once and would have rotted from there. Not scoped with --affected: a
      # change to a package's source can break a suite in a package that depends
      # on it, and these are fast enough that running all of them is cheaper
      # than reasoning about which ones matter.
      - name: Run unit tests
        run: pnpm turbo run test

  # Type check depends on build artifacts
  check-types:
    name: check:types
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ env.TURBO_SCM_BASE }}-${{ env.TURBO_SCM_HEAD }}
          # Without a fallback this key misses on every push after the first --
          # it names both SHAs -- so the cache was restored almost never and the
          # job rebuilt its dependencies from cold each time.
          restore-keys: |
            turbo-${{ runner.os }}-${{ env.TURBO_SCM_BASE }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check:types
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm turbo run check:types
          else
            pnpm turbo run check:types --affected
          fi
