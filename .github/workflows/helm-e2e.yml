name: Qualify Hangar Helm Chart

on:
  workflow_call:
    inputs:
      image_tag:
        description: Existing Hangar image tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing Hangar image tag, such as preview-my-branch or v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: helm-e2e-${{ github.ref }}-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/szymczag/hangar-

jobs:
  qualify:
    name: Kubernetes 1.35.5 evaluation profile
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "image_tag is not a valid OCI image tag" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage chart with immutable release images
        id: stage_chart
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          chart_dir="$RUNNER_TEMP/hangar-chart"
          cp -a charts/hangar "$chart_dir"

          for component in web admin space live api; do
            digest=$(docker buildx imagetools inspect "${IMAGE_PREFIX}${component}:${IMAGE_TAG}" | awk '$1 == "Digest:" { print $2; exit }')
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Could not resolve immutable digest for ${component}:${IMAGE_TAG}" >&2
              exit 1
            fi
            export "${component^^}_DIGEST=$digest"
          done

          if [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            chart_app_version="$IMAGE_TAG"
          else
            chart_app_version="v0.0.0-e2e.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi

          charts/hangar/scripts/prepare-release.sh "$chart_dir" "$chart_app_version"
          "$chart_dir/tests/render-policy.sh"
          echo "chart_app_version=$chart_app_version" >> "$GITHUB_OUTPUT"

      - name: Package candidate chart
        id: package_chart
        env:
          CHART_APP_VERSION: ${{ steps.stage_chart.outputs.chart_app_version }}
        run: |
          set -euo pipefail
          chart_version="${CHART_APP_VERSION#v}"
          helm package "$RUNNER_TEMP/hangar-chart" \
            --dependency-update=false \
            --destination "$RUNNER_TEMP"
          echo "chart_package=$RUNNER_TEMP/hangar-${chart_version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Install pinned Kubernetes test tools
        run: |
          set -euo pipefail
          charts/hangar/tests/install-e2e-tools.sh "$RUNNER_TEMP/e2e-bin"
          echo "$RUNNER_TEMP/e2e-bin" >> "$GITHUB_PATH"

      - name: Run ephemeral-cluster qualification
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: charts/hangar/tests/e2e-kind.sh "${{ steps.package_chart.outputs.chart_package }}"
