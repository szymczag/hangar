name: Release metadata tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - preview
    paths:
      - "UPSTREAM_BASE.json"
      - ".github/scripts/release_metadata.py"
      - ".github/scripts/release_notes.py"
      - ".github/scripts/security_scan.py"
      - ".github/workflows/security-scan.yml"
      - ".github/scripts/upstream_watch.py"
      - ".github/workflows/upstream-watch.yml"
      - ".trivyignore.yaml"
      - ".github/scripts/tests/**"
      - ".github/workflows/build-branch.yml"
      - ".github/workflows/release-metadata-tests.yml"
      # test_workflow_action_pins.py covers every workflow.
      - ".github/workflows/**"
      - "apps/api/bin/**"
      - "docs/releases/**"
      - "docs/kubernetes/README.md"
      - "deployments/cli/community/**"
      - "deployments/swarm/community/**"
      - "apps/*/public/config.js"
      - "apps/space/app/issues/**"
      - "packages/constants/src/endpoints.ts"
      - "apps/api/plane/settings/common.py"
      - "apps/live/src/env.ts"
      - "docker-compose.yml"
      - ".github/dependabot.yml"
  push:
    branches:
      - preview
    paths:
      - "UPSTREAM_BASE.json"
      - ".github/scripts/release_metadata.py"
      - ".github/scripts/release_notes.py"
      - ".github/scripts/security_scan.py"
      - ".github/workflows/security-scan.yml"
      - ".github/scripts/upstream_watch.py"
      - ".github/workflows/upstream-watch.yml"
      - ".trivyignore.yaml"
      - ".github/scripts/tests/**"
      - ".github/workflows/build-branch.yml"
      - ".github/workflows/release-metadata-tests.yml"
      # test_workflow_action_pins.py covers every workflow.
      - ".github/workflows/**"
      - "apps/api/bin/**"
      - "docs/releases/**"
      - "docs/kubernetes/README.md"
      - "deployments/cli/community/**"
      - "deployments/swarm/community/**"
      - "apps/*/public/config.js"
      - "apps/space/app/issues/**"
      - "packages/constants/src/endpoints.ts"
      - "apps/api/plane/settings/common.py"
      - "apps/live/src/env.ts"
      - "docker-compose.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  test:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run release metadata unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      - name: Validate the repository upstream baseline
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_metadata.py \
            --event-name workflow_dispatch \
            --ref-name preview \
            --commit-sha "$COMMIT_SHA" \
            --format github-output
