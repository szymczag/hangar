name: Release metadata tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - preview
    paths:
      - "UPSTREAM_BASE.json"
      - ".github/scripts/release_metadata.py"
      - ".github/scripts/tests/test_release_metadata.py"
      - ".github/workflows/build-branch.yml"
      - ".github/workflows/release-metadata-tests.yml"
  push:
    branches:
      - preview
    paths:
      - "UPSTREAM_BASE.json"
      - ".github/scripts/release_metadata.py"
      - ".github/scripts/tests/test_release_metadata.py"
      - ".github/workflows/build-branch.yml"
      - ".github/workflows/release-metadata-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0

      - name: Run release metadata unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      - name: Validate the repository upstream baseline
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_metadata.py \
            --event-name workflow_dispatch \
            --ref-name preview \
            --commit-sha "$COMMIT_SHA"
