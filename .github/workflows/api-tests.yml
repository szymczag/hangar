name: API tests

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "docker-compose-test.yml"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - preview

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Generate API environment
        run: |
          cp apps/api/.env.example apps/api/.env
          printf '\nSECRET_KEY="%s"\n' "$(openssl rand -hex 32)" >> apps/api/.env

      - name: Run API test suite
        run: |
          docker compose -f docker-compose-test.yml run --rm --build \
            api-tests pytest \
            --ignore=plane/tests/contract/app/test_todoist_import_app.py \
            --ignore=plane/tests/unit/ext/test_import_storage.py \
            --ignore=plane/tests/unit/ext/test_todoist_csv.py \
            --ignore=plane/tests/unit/ext/test_todoist_import_execution.py \
            --ignore=plane/tests/unit/ext/test_todoist_import_tasks.py

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  todoist-import:
    name: todoist-import (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contract
            tests: plane/tests/contract/app/test_todoist_import_app.py
          - name: storage
            tests: plane/tests/unit/ext/test_import_storage.py
          - name: parser
            tests: plane/tests/unit/ext/test_todoist_csv.py
          - name: execution
            tests: plane/tests/unit/ext/test_todoist_import_execution.py
          - name: tasks
            tests: plane/tests/unit/ext/test_todoist_import_tasks.py
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Generate API environment
        run: |
          cp apps/api/.env.example apps/api/.env
          printf '\nSECRET_KEY="%s"\n' "$(openssl rand -hex 32)" >> apps/api/.env

      - name: Run Todoist importer tests
        run: |
          docker compose -f docker-compose-test.yml run --rm --build \
            api-tests pytest ${{ matrix.tests }}

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  runner-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Generate API environment
        run: |
          cp apps/api/.env.example apps/api/.env
          printf '\nSECRET_KEY="%s"\n' "$(openssl rand -hex 32)" >> apps/api/.env

      - name: Verify Runner migrations and database invariants
        run: |
          docker compose -f docker-compose-test.yml run --rm --build api-tests \
            pytest --migrations --create-db -m runner_migrations \
            plane/tests/contract/app/test_runner_installation_app.py

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
