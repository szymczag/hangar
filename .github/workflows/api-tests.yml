name: API tests

# Deliberately unfiltered. A path filter here stops the whole workflow from
# running, so a required check inside it would never report on a pull request
# that does not touch the API and would block it forever. The filter now lives
# in the changes job below, which every job here is gated on, so the heavy work
# is still skipped while the gate job still reports.
on:
  pull_request:
  push:
    branches:
      - preview

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: api-tests-importer-bounded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Check out the pushed commits
        if: github.event_name == 'push'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 2
          filter: blob:none

      - name: Decide whether the API changed
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -n "${PR:-}" ]; then
            changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          elif [ "$EVENT_NAME" = "push" ]; then
            # A normal preview push has both ends of the exact range available
            # from the two-commit checkout. Fail open to the full suite for a
            # new branch, force push, or any other incomplete history.
            if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
              [[ "$BEFORE_SHA" =~ ^0{40}$ ]] ||
              ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              echo "Could not establish the pushed range; running all API tests."
              echo "api=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            changed=$(git diff --name-only "$BEFORE_SHA" "$COMMIT_SHA")
          else
            # A manual run has no trustworthy comparison range.
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -qE '^(apps/api/|docker-compose-test\.yml$|\.github/workflows/api-tests\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Generate API environment
        run: |
          cp apps/api/.env.example apps/api/.env
          printf '\nSECRET_KEY="%s"\n' "$(openssl rand -hex 32)" >> apps/api/.env

      - name: Run API test suite
        run: |
          docker compose -f docker-compose-test.yml run --rm --build \
            api-tests pytest \
            --ignore=plane/tests/contract/app/test_todoist_import_app.py \
            --ignore=plane/tests/unit/ext/test_import_storage.py \
            --ignore=plane/tests/unit/ext/test_todoist_import_execution.py \
            --ignore=plane/tests/unit/ext/test_todoist_import_tasks.py

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  todoist-import:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    name: todoist-import (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contract
            tests: plane/tests/contract/app/test_todoist_import_app.py
            compose_args: ""
          - name: storage
            tests: plane/tests/unit/ext/test_import_storage.py
            compose_args: --no-deps
          - name: execution
            tests: plane/tests/unit/ext/test_todoist_import_execution.py
            compose_args: ""
          - name: tasks
            tests: plane/tests/unit/ext/test_todoist_import_tasks.py
            compose_args: ""
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Generate API environment
        run: |
          cp apps/api/.env.example apps/api/.env
          printf '\nSECRET_KEY="%s"\n' "$(openssl rand -hex 32)" >> apps/api/.env

      - name: Run Todoist importer tests
        run: |
          docker compose -f docker-compose-test.yml run ${{ matrix.compose_args }} --rm --build \
            api-tests pytest ${{ matrix.tests }}

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  security-migrations:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Generate API environment
        run: |
          cp apps/api/.env.example apps/api/.env
          printf '\nSECRET_KEY="%s"\n' "$(openssl rand -hex 32)" >> apps/api/.env

      - name: Verify security migrations and database invariants
        run: |
          docker compose -f docker-compose-test.yml run --rm --build api-tests \
            pytest --migrations --create-db \
            -m "runner_migrations or todoist_migrations" \
            plane/tests/contract/app/test_runner_installation_app.py \
            plane/tests/unit/ext/test_todoist_import_tasks.py

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  # The context to require on the branch ruleset. It runs whatever the jobs above
  # did, so it reports on every pull request, and it treats skipped as success so
  # a front-end-only change is not held up by tests that had no reason to run.
  api-tests:
    name: API tests
    needs: [changes, pytest, todoist-import, security-migrations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every API test job to have succeeded or been skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          TODOIST_RESULT: ${{ needs.todoist-import.result }}
          MIGRATIONS_RESULT: ${{ needs.security-migrations.result }}
        run: |
          set -euo pipefail

          failed=0
          for entry in \
            "changes=$CHANGES_RESULT" \
            "pytest=$PYTEST_RESULT" \
            "todoist-import=$TODOIST_RESULT" \
            "security-migrations=$MIGRATIONS_RESULT"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              *) echo "$name: $result" >&2; failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "API tests did not complete successfully." >&2
            exit 1
          fi
