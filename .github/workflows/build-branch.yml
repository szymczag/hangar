name: Publish Hangar Containers

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/szymczag/hangar-

jobs:
  setup:
    name: Validate publication
    runs-on: ubuntu-22.04
    outputs:
      is_release: ${{ steps.metadata.outputs.is_release }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      primary_tag: ${{ steps.metadata.outputs.primary_tag }}
      sha_tag: ${{ steps.metadata.outputs.sha_tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate ref and calculate tags
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "sha_tag=sha-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" ]]; then
            semver_regex='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
            if [[ ! "$REF_NAME" =~ $semver_regex ]]; then
              echo "Unsupported release tag: $REF_NAME" >&2
              exit 1
            fi

            git fetch --no-tags origin preview
            if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/preview; then
              echo "Release commit must be contained in origin/preview" >&2
              exit 1
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "primary_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            if [[ "$REF_NAME" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            preview_ref=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//; s/[.-]+$//')
            if [[ -z "$preview_ref" ]]; then
              echo "The selected ref cannot be converted to a safe OCI tag" >&2
              exit 1
            fi

            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "version=$preview_ref" >> "$GITHUB_OUTPUT"
            echo "primary_tag=preview-$preview_ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject an existing immutable release
        if: steps.metadata.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $VERSION already exists" >&2
            exit 1
          fi

          for image in web admin space live api proxy aio; do
            if docker manifest inspect "${IMAGE_PREFIX}${image}:${VERSION}" >/dev/null 2>&1; then
              echo "Immutable image tag already exists: ${IMAGE_PREFIX}${image}:${VERSION}" >&2
              exit 1
            fi
          done

  release_approval:
    name: Approve release publication
    if: needs.setup.outputs.is_release == 'true'
    needs: setup
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Record approval
        run: echo "Release publication approved"

  components:
    name: Publish ${{ matrix.image }}
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (needs.release_approval.result == 'success' || needs.release_approval.result == 'skipped')
    needs: [setup, release_approval]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - image: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - image: proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ needs.setup.outputs.primary_tag }}
            ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ needs.setup.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=Hangar ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: needs.setup.outputs.is_release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release image
        if: needs.setup.outputs.is_release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify release image signature
        if: needs.setup.outputs.is_release == 'true'
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}${{ matrix.image }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

  aio:
    name: Publish aio
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      needs.components.result == 'success'
    needs: [setup, components]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2

      - name: Prepare AIO assets
        env:
          VERSION: ${{ needs.setup.outputs.primary_tag }}
        run: deployments/aio/community/build.sh --release="$VERSION" --image-name="${IMAGE_PREFIX}aio"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./deployments/aio/community
          file: ./deployments/aio/community/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}aio:${{ needs.setup.outputs.primary_tag }}
            ${{ env.IMAGE_PREFIX }}aio:${{ needs.setup.outputs.sha_tag }}
          build-args: |
            IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            PLANE_VERSION=${{ needs.setup.outputs.primary_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=Hangar aio
          cache-from: type=gha,scope=aio
          cache-to: type=gha,mode=max,scope=aio
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}aio
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: needs.setup.outputs.is_release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release image
        if: needs.setup.outputs.is_release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}aio
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify release image signature
        if: needs.setup.outputs.is_release == 'true'
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}aio
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

  verify_publication:
    name: Verify container publication
    if: always()
    needs: [setup, components, aio]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every publication job to succeed
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
          AIO_RESULT: ${{ needs.aio.result }}
        run: |
          set -euo pipefail

          if [[ "$SETUP_RESULT" != "success" || "$COMPONENTS_RESULT" != "success" || "$AIO_RESULT" != "success" ]]; then
            echo "Container publication incomplete:" >&2
            echo "  setup=$SETUP_RESULT" >&2
            echo "  components=$COMPONENTS_RESULT" >&2
            echo "  aio=$AIO_RESULT" >&2
            exit 1
          fi

          echo "All required container publication jobs succeeded"

  release:
    name: Publish GitHub Release
    if: needs.setup.outputs.is_release == 'true'
    needs: [setup, verify_publication]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Promote stable manifests
        if: needs.setup.outputs.is_prerelease != 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          for image in web admin space live api proxy aio; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}${image}:stable" \
              "${IMAGE_PREFIX}${image}:${VERSION}"
          done

      - name: Stage release assets
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp deployments/cli/community/install.sh release-assets/setup.sh
          cp deployments/cli/community/restore.sh release-assets/
          cp deployments/cli/community/restore-airgapped.sh release-assets/
          cp deployments/cli/community/docker-compose.yml release-assets/
          cp deployments/cli/community/variables.env release-assets/
          cp deployments/swarm/community/swarm.sh release-assets/
          sed -i "s/\${APP_RELEASE:-stable}/\${APP_RELEASE:-${VERSION}}/g" release-assets/docker-compose.yml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
          IS_PRERELEASE: ${{ needs.setup.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "$VERSION" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" release-assets/* "${args[@]}"
