name: Publish Hangar Containers

on:
  workflow_dispatch:
    inputs:
      run_helm_e2e:
        description: Qualify the published preview images with the Helm Kubernetes E2E suite
        required: false
        default: false
        type: boolean
      reuse_preview_images:
        description: Retry Helm qualification against the existing branch preview images without rebuilding them
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "hangar-v[0-9]+.[0-9]+.[0-9]+"
      - "hangar-v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/szymczag/hangar-

jobs:
  setup:
    name: Validate publication
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    outputs:
      is_release: ${{ steps.metadata.outputs.is_release }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      git_tag: ${{ steps.metadata.outputs.git_tag }}
      primary_tag: ${{ steps.metadata.outputs.primary_tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      sha_tag: ${{ steps.metadata.outputs.sha_tag }}
      upstream_package_version: ${{ steps.metadata.outputs.upstream_package_version }}
      upstream_repository: ${{ steps.metadata.outputs.upstream_repository }}
      upstream_revision: ${{ steps.metadata.outputs.upstream_revision }}
      upstream_synced_at: ${{ steps.metadata.outputs.upstream_synced_at }}
      version: ${{ steps.metadata.outputs.version }}
      public_origin: ${{ steps.public_origin.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_metadata.py \
            --event-name "$EVENT_NAME" \
            --ref-name "$REF_NAME" \
            --commit-sha "$COMMIT_SHA" \
            --format github-output >> "$GITHUB_OUTPUT"

      - name: Read canonical public origin
        id: public_origin
        run: |
          set -euo pipefail
          public_origin=$(awk '
            /^publicUrl:$/ { in_public_url = 1; next }
            in_public_url && /^  scheme:/ { scheme = $2; next }
            in_public_url && /^  host:/ { host = $2; print scheme "://" host; exit }
          ' charts/hangar/values.yaml)
          if [[ ! "$public_origin" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid canonical public origin: $public_origin" >&2
            exit 1
          fi
          echo "value=$public_origin" >> "$GITHUB_OUTPUT"

      - name: Validate curated release notes
        if: steps.metadata.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ steps.metadata.outputs.git_tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-pages.json
          python3 .github/scripts/release_notes.py validate \
            --git-tag "$GIT_TAG" \
            --commit-sha "$GITHUB_SHA" \
            --release-pages release-pages.json \
            --transition-reviews docs/releases/upstream-transition-reviews.json

      - name: Validate Kubernetes release documentation
        if: steps.metadata.outputs.is_release == 'true'
        env:
          GIT_TAG: ${{ steps.metadata.outputs.git_tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chart_version="${VERSION#v}"
          documentation=docs/kubernetes/README.md

          require_literal() {
            local expected="$1"
            if ! grep --fixed-strings --quiet "$expected" "$documentation"; then
              echo "$documentation is not synchronized with release $GIT_TAG: missing $expected" >&2
              exit 1
            fi
          }

          require_literal "The current release is \`$chart_version\`."
          require_literal "The \`$chart_version\` qualification boundary is:"
          require_literal "| Product version    | \`$VERSION\`"
          require_literal "| Helm chart version | \`$chart_version\`"
          require_literal "| Git tag            | \`$GIT_TAG\`"
          require_literal "| OCI chart          | \`ghcr.io/szymczag/charts/hangar:$chart_version\`"

      - name: Require release commit on preview
        if: steps.metadata.outputs.is_release == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin preview
          git merge-base --is-ancestor "$COMMIT_SHA" origin/preview || {
            echo "Release commit must be contained in origin/preview" >&2
            exit 1
          }

      - name: Require a verified annotated release tag
        if: steps.metadata.outputs.is_release == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ steps.metadata.outputs.git_tag }}
        run: |
          set -euo pipefail
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GIT_TAG")
          object_type=$(jq -r '.object.type' <<< "$tag_object")
          tag_object_sha=$(jq -r '.object.sha' <<< "$tag_object")
          if [[ "$object_type" != "tag" || ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release tags must be annotated and signed" >&2
            exit 1
          fi

          tag_data=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          if [[ $(jq -r '.verification.verified' <<< "$tag_data") != "true" ]]; then
            echo "GitHub did not verify the release tag signature" >&2
            exit 1
          fi
          if [[ $(jq -r '.tag' <<< "$tag_data") != "$GIT_TAG" ]]; then
            echo "Signed tag name does not match the pushed release ref" >&2
            exit 1
          fi
          if [[ $(jq -r '.object.type' <<< "$tag_data") != "commit" || $(jq -r '.object.sha' <<< "$tag_data") != "$COMMIT_SHA" ]]; then
            echo "Release tag does not point directly to the workflow commit" >&2
            exit 1
          fi

      - name: Log in to GHCR for immutable-tag checks
        if: steps.metadata.outputs.is_release == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable release
        if: steps.metadata.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ steps.metadata.outputs.git_tag }}
          SHA_TAG: ${{ steps.metadata.outputs.sha_tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GIT_TAG}")
          case "$release_status" in
            200)
              echo "GitHub Release $GIT_TAG already exists" >&2
              exit 1
              ;;
            404) ;;
            *)
              echo "GitHub Release immutability check failed with HTTP $release_status" >&2
              exit 1
              ;;
          esac

          reject_existing_image_tag() {
            local image_tag="$1"
            local inspect_error
            if inspect_error=$(docker manifest inspect "$image_tag" 2>&1); then
              echo "Immutable image tag already exists: $image_tag" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|no such manifest' <<< "$inspect_error"; then
              echo "Could not prove that immutable image tag is unused: $image_tag" >&2
              echo "$inspect_error" >&2
              exit 1
            fi
          }

          for image in web admin space live api proxy aio; do
            reject_existing_image_tag "${IMAGE_PREFIX}${image}:${VERSION}"
            reject_existing_image_tag "${IMAGE_PREFIX}${image}:${SHA_TAG}"
          done

          reject_existing_image_tag "ghcr.io/szymczag/charts/hangar:${VERSION#v}"

  signing_tools:
    name: Prepare release signing tool
    if: needs.setup.outputs.is_release == 'true'
    needs: setup
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Install and verify Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Cosign is executable
        run: cosign version

      - name: Preserve verified Cosign for publication jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cosign-${{ github.run_id }}
          path: ~/.cosign/cosign
          if-no-files-found: error
          retention-days: 1

  release_approval:
    name: Approve release publication
    if: needs.setup.outputs.is_release == 'true'
    needs: [setup, signing_tools]
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Record approval
        run: echo "Release publication approved"

  components:
    name: Publish ${{ matrix.image }}
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (needs.signing_tools.result == 'success' || needs.signing_tools.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.reuse_preview_images == true) &&
      (needs.release_approval.result == 'success' || needs.release_approval.result == 'skipped')
    needs: [setup, signing_tools, release_approval]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - image: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - image: proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore verified Cosign
        if: needs.setup.outputs.is_release == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cosign-${{ github.run_id }}
          path: ${{ runner.temp }}/cosign

      - name: Add verified Cosign to PATH
        if: needs.setup.outputs.is_release == 'true'
        run: |
          chmod 0755 "$RUNNER_TEMP/cosign/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ needs.setup.outputs.primary_tag }}
            ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ needs.setup.outputs.sha_tag }}
          build-args: |
            APP_VERSION=${{ needs.setup.outputs.version }}
            HANGAR_SOURCE_REVISION=${{ github.sha }}
            VITE_SOURCE_CODE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
            VITE_ADMIN_BASE_URL=${{ needs.setup.outputs.public_origin }}
            VITE_SPACE_BASE_URL=${{ needs.setup.outputs.public_origin }}
            VITE_LIVE_BASE_URL=${{ needs.setup.outputs.public_origin }}
            VITE_WEB_BASE_URL=${{ needs.setup.outputs.public_origin }}
            VITE_API_BASE_URL=${{ needs.setup.outputs.public_origin }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=Hangar ${{ matrix.image }}
            io.github.szymczag.hangar.release.tag=${{ needs.setup.outputs.git_tag }}
            io.github.szymczag.hangar.upstream.repository=${{ needs.setup.outputs.upstream_repository }}
            io.github.szymczag.hangar.upstream.revision=${{ needs.setup.outputs.upstream_revision }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign release image
        if: needs.setup.outputs.is_release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}${{ matrix.image }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE}@${DIGEST}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Cosign signing failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify release image signature
        if: needs.setup.outputs.is_release == 'true'
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}${{ matrix.image }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

  aio:
    name: Publish aio
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (needs.signing_tools.result == 'success' || needs.signing_tools.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.reuse_preview_images == true) &&
      needs.components.result == 'success'
    needs: [setup, signing_tools, components]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2

      - name: Prepare AIO assets
        env:
          VERSION: ${{ needs.setup.outputs.primary_tag }}
        run: deployments/aio/community/build.sh --release="$VERSION" --image-name="${IMAGE_PREFIX}aio"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore verified Cosign
        if: needs.setup.outputs.is_release == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cosign-${{ github.run_id }}
          path: ${{ runner.temp }}/cosign

      - name: Add verified Cosign to PATH
        if: needs.setup.outputs.is_release == 'true'
        run: |
          chmod 0755 "$RUNNER_TEMP/cosign/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./deployments/aio/community
          file: ./deployments/aio/community/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}aio:${{ needs.setup.outputs.primary_tag }}
            ${{ env.IMAGE_PREFIX }}aio:${{ needs.setup.outputs.sha_tag }}
          build-args: |
            IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            PLANE_VERSION=${{ needs.setup.outputs.primary_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=Hangar aio
            io.github.szymczag.hangar.release.tag=${{ needs.setup.outputs.git_tag }}
            io.github.szymczag.hangar.upstream.repository=${{ needs.setup.outputs.upstream_repository }}
            io.github.szymczag.hangar.upstream.revision=${{ needs.setup.outputs.upstream_revision }}
          cache-from: type=gha,scope=aio
          cache-to: type=gha,mode=max,scope=aio
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}aio
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign release image
        if: needs.setup.outputs.is_release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}aio
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE}@${DIGEST}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Cosign signing failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify release image signature
        if: needs.setup.outputs.is_release == 'true'
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}aio
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

  preview_helm_e2e:
    name: Qualify preview Helm chart
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_helm_e2e == true &&
      needs.setup.result == 'success' &&
      (needs.aio.result == 'success' ||
      (inputs.reuse_preview_images == true && needs.aio.result == 'skipped'))
    needs: [setup, aio]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/helm-e2e.yml
    with:
      image_tag: ${{ needs.setup.outputs.primary_tag }}
    secrets: inherit

  chart:
    name: Publish Helm chart
    if: needs.setup.outputs.is_release == 'true'
    needs: [setup, signing_tools, components, aio]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.publish_chart.outputs.digest }}
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore verified Cosign
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cosign-${{ github.run_id }}
          path: ${{ runner.temp }}/cosign

      - name: Add verified Cosign to PATH
        run: |
          chmod 0755 "$RUNNER_TEMP/cosign/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"

      - name: Resolve images and prepare release chart
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          chart_dir="$RUNNER_TEMP/hangar-chart"
          cp -a charts/hangar "$chart_dir"

          for component in web admin space live api; do
            digest=$(docker buildx imagetools inspect "${IMAGE_PREFIX}${component}:${VERSION}" | awk '$1 == "Digest:" && !digest { digest = $2 } END { print digest }')
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Could not resolve immutable digest for ${component}:${VERSION}" >&2
              exit 1
            fi
            export "${component^^}_DIGEST=$digest"
          done

          charts/hangar/scripts/prepare-release.sh "$chart_dir" "$VERSION"
          "$chart_dir/tests/render-policy.sh"

      - name: Package candidate chart
        id: package_chart
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          chart_dir="$RUNNER_TEMP/hangar-chart"
          helm package "$chart_dir" --dependency-update=false --destination "$RUNNER_TEMP"

          chart_version="${VERSION#v}"
          chart_package="$RUNNER_TEMP/hangar-${chart_version}.tgz"
          test -f "$chart_package"
          echo "chart_package=$chart_package" >> "$GITHUB_OUTPUT"

      - name: Install pinned Kubernetes test tools
        run: |
          set -euo pipefail
          charts/hangar/tests/install-e2e-tools.sh "$RUNNER_TEMP/e2e-bin"
          echo "$RUNNER_TEMP/e2e-bin" >> "$GITHUB_PATH"

      - name: Qualify release chart in an ephemeral cluster
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: charts/hangar/tests/e2e-kind.sh "${{ steps.package_chart.outputs.chart_package }}"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.package_chart.outputs.chart_package }}

      - name: Publish and verify chart
        id: publish_chart
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          CHART_PACKAGE: ${{ steps.package_chart.outputs.chart_package }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          push_output=$(helm push "$CHART_PACKAGE" oci://ghcr.io/szymczag/charts 2>&1)
          printf '%s\n' "$push_output"
          chart_digest=$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" && !digest { digest = $2 } END { print digest }')
          if [[ ! "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Helm did not return a valid OCI chart digest" >&2
            exit 1
          fi

          chart_ref="ghcr.io/szymczag/charts/hangar@${chart_digest}"
          for attempt in 1 2 3; do
            if cosign sign --yes "$chart_ref"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Cosign signing failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$chart_ref"
          echo "digest=$chart_digest" >> "$GITHUB_OUTPUT"

  verify_publication:
    name: Verify publication
    if: >-
      always() &&
      !(github.event_name == 'workflow_dispatch' && inputs.reuse_preview_images == true)
    needs: [setup, components, aio, chart]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every publication job to succeed
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
          AIO_RESULT: ${{ needs.aio.result }}
          CHART_RESULT: ${{ needs.chart.result }}
          IS_RELEASE: ${{ needs.setup.outputs.is_release }}
        run: |
          set -euo pipefail

          if [[ "$SETUP_RESULT" != "success" || "$COMPONENTS_RESULT" != "success" || "$AIO_RESULT" != "success" ]]; then
            echo "Container publication incomplete:" >&2
            echo "  setup=$SETUP_RESULT" >&2
            echo "  components=$COMPONENTS_RESULT" >&2
            echo "  aio=$AIO_RESULT" >&2
            exit 1
          fi

          expected_chart_result=skipped
          if [[ "$IS_RELEASE" == "true" ]]; then
            expected_chart_result=success
          fi
          if [[ "$CHART_RESULT" != "$expected_chart_result" ]]; then
            echo "Unexpected chart publication result: $CHART_RESULT (expected $expected_chart_result)" >&2
            exit 1
          fi

          echo "All required publication jobs succeeded"

  release:
    name: Publish GitHub Release
    if: needs.setup.outputs.is_release == 'true'
    needs: [setup, verify_publication, chart]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      - name: Stage release assets
        env:
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp deployments/cli/community/install.sh release-assets/setup.sh
          cp deployments/cli/community/restore.sh release-assets/
          cp deployments/cli/community/restore-airgapped.sh release-assets/
          cp deployments/cli/community/docker-compose.yml release-assets/
          cp deployments/cli/community/variables.env release-assets/
          cp deployments/swarm/community/swarm.sh release-assets/
          sed -i "s/\${APP_RELEASE:-stable}/\${APP_RELEASE:-${VERSION}}/g" release-assets/docker-compose.yml

          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm pull oci://ghcr.io/szymczag/charts/hangar --version "${VERSION#v}" --destination release-assets
          chart_package="release-assets/hangar-${VERSION#v}.tgz"
          chart_checksum=$(sha256sum "$chart_package" | awk '{ print $1 }')
          printf '%s  %s\n' "$chart_checksum" "$(basename "$chart_package")" > "${chart_package}.sha256"
          printf 'ghcr.io/szymczag/charts/hangar@%s\n' "$CHART_DIGEST" > release-assets/chart-oci-digest.txt

      - name: Generate release notes from published evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.setup.outputs.git_tag }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-pages.json

          digests='{}'
          for image in web admin space live api proxy aio; do
            image_ref="${IMAGE_PREFIX}${image}:${VERSION}"
            manifest=$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}')
            digest=$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")
            digests=$(jq --arg image "$image" --arg digest "$digest" '. + {($image): $digest}' <<< "$digests")
          done
          printf '%s\n' "$digests" > release-digests.json

          python3 .github/scripts/release_notes.py generate \
            --git-tag "$GIT_TAG" \
            --commit-sha "$GITHUB_SHA" \
            --release-pages release-pages.json \
            --digests release-digests.json \
            --transition-reviews docs/releases/upstream-transition-reviews.json \
            > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.setup.outputs.git_tag }}
          RELEASE_TITLE: ${{ needs.setup.outputs.release_title }}
          IS_PRERELEASE: ${{ needs.setup.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md --verify-tag)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GIT_TAG" release-assets/* "${args[@]}"

      - name: Promote stable manifests
        if: needs.setup.outputs.is_prerelease != 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          for image in web admin space live api proxy aio; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}${image}:stable" \
              "${IMAGE_PREFIX}${image}:${VERSION}"
          done
