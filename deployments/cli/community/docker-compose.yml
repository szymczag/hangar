x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  IMPORT_S3_BUCKET_NAME: ${IMPORT_S3_BUCKET_NAME:-uploads-imports}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL}
  CERT_ACME_CA: ${CERT_ACME_CA}
  CERT_ACME_DNS: ${CERT_ACME_DNS}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &mq-env # RabbitMQ Settings
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane:plane@plane-db/plane}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: ${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  HANGAR_DOCUMENTATION_URL: ${HANGAR_DOCUMENTATION_URL:-https://github.com/szymczag/hangar#readme}
  HANGAR_ISSUES_URL: ${HANGAR_ISSUES_URL:-https://github.com/szymczag/hangar/issues}
  HANGAR_SECURITY_URL: ${HANGAR_SECURITY_URL:-https://github.com/szymczag/hangar/security/advisories/new}
  HANGAR_TERMS_URL: ${HANGAR_TERMS_URL:-}
  HANGAR_PRIVACY_URL: ${HANGAR_PRIVACY_URL:-}
  TODOIST_IMPORTS_ENABLED: ${TODOIST_IMPORTS_ENABLED:-0}
  ENABLE_GOOGLE_CALENDAR_CAPACITY: ${ENABLE_GOOGLE_CALENDAR_CAPACITY:-0}
  CALENDAR_TOKEN_ENCRYPTION_KEYS: ${CALENDAR_TOKEN_ENCRYPTION_KEYS:-}
  TODOIST_IMPORT_LEASE_SECONDS: ${TODOIST_IMPORT_LEASE_SECONDS:-120}
  TODOIST_IMPORT_RECOVERY_GRACE_SECONDS: ${TODOIST_IMPORT_RECOVERY_GRACE_SECONDS:-30}
  TODOIST_IMPORT_SOURCE_RETENTION_HOURS: ${TODOIST_IMPORT_SOURCE_RETENTION_HOURS:-24}
  TODOIST_IMPORT_PREVIEW_USER_RATE: ${TODOIST_IMPORT_PREVIEW_USER_RATE:-10/minute}
  TODOIST_IMPORT_PREVIEW_WORKSPACE_RATE: ${TODOIST_IMPORT_PREVIEW_WORKSPACE_RATE:-30/minute}
  TODOIST_IMPORT_EXECUTE_USER_RATE: ${TODOIST_IMPORT_EXECUTE_USER_RATE:-3/hour}
  TODOIST_IMPORT_EXECUTE_WORKSPACE_RATE: ${TODOIST_IMPORT_EXECUTE_WORKSPACE_RATE:-10/hour}
  TODOIST_IMPORT_MAX_ACTIVE_PER_USER: ${TODOIST_IMPORT_MAX_ACTIVE_PER_USER:-1}
  TODOIST_IMPORT_MAX_ACTIVE_PER_WORKSPACE: ${TODOIST_IMPORT_MAX_ACTIVE_PER_WORKSPACE:-2}
  TODOIST_IMPORT_MAX_ROWS_PER_WORKSPACE_24H: ${TODOIST_IMPORT_MAX_ROWS_PER_WORKSPACE_24H:-50000}
  TODOIST_IMPORT_MAX_ACTIVE_SOURCE_BYTES_PER_WORKSPACE: ${TODOIST_IMPORT_MAX_ACTIVE_SOURCE_BYTES_PER_WORKSPACE:-10485760}
  TODOIST_IMPORT_WORKER_CONCURRENCY: ${TODOIST_IMPORT_WORKER_CONCURRENCY:-2}
  TODOIST_IMPORT_WORKER_PREFETCH_MULTIPLIER: ${TODOIST_IMPORT_WORKER_PREFETCH_MULTIPLIER:-1}
  # God Mode second factor. These must be passed explicitly: this list is the
  # whole environment the API containers receive, so a value set only in
  # variables.env never reaches them. ADMIN_WEBAUTHN_REQUIRED is the documented
  # way to recover a console nobody can sign in to, which makes it useless if it
  # cannot be set here.
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Hangar}
  WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-}
  ADMIN_WEBAUTHN_REQUIRED: ${ADMIN_WEBAUTHN_REQUIRED:-1}
  ADMIN_2FA_PENDING_ASSERT_WINDOW: ${ADMIN_2FA_PENDING_ASSERT_WINDOW:-300}
  ADMIN_2FA_PENDING_ENROLL_WINDOW: ${ADMIN_2FA_PENDING_ENROLL_WINDOW:-900}
  ADMIN_2FA_CHALLENGE_TTL: ${ADMIN_2FA_CHALLENGE_TTL:-300}
  ADMIN_2FA_MAX_ATTEMPTS: ${ADMIN_2FA_MAX_ATTEMPTS:-5}

services:
  web:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-web:${APP_RELEASE:-stable}
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker

  space:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-space:${APP_RELEASE:-stable}
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
      - web

  admin:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-admin:${APP_RELEASE:-stable}
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  live:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-live:${APP_RELEASE:-stable}
    environment:
      <<: [*live-env, *redis-env]
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  api:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  import-worker:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: ${IMPORT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_import-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
      HANGAR_WORKER_QUEUE: imports
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-beat.sh
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-db
      - plane-redis

  # Comment this if you already have a database running
  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Comment this if you using any external s3 compatible storage
  plane-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  # Comment this if you already have a reverse proxy running
  proxy:
    image: ${DOCKERHUB_USER:-ghcr.io/szymczag}/hangar-proxy:${APP_RELEASE:-stable}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *proxy-env
    ports:
      - target: 80
        published: ${LISTEN_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${LISTEN_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_import-worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
